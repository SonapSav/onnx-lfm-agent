[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-lfm-agent"
version = "0.0.1"
description = "Agentic tool-calling harness over the onnx-lfm-api OpenAI endpoint"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lfm-agent = "onnx_lfm_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
